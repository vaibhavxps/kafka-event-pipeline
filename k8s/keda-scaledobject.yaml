# ============================================================
# KEDA ScaledObject — Autoscales the consumer deployment
# based on Kafka consumer group lag.
#
# Prerequisites:
#   1. KEDA must be installed in the cluster.
#      kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.13.0/keda-2.13.0.yaml
#
#   2. The consumer Deployment must exist before applying this.
# ============================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: consumer-scaledobject
  labels:
    app: consumer
spec:
  scaleTargetRef:
    name: consumer                      # targets the consumer Deployment
  pollingInterval: 15                   # check lag every 15 seconds
  cooldownPeriod: 60                    # wait 60s before scaling down
  minReplicaCount: 1                    # never scale to zero
  maxReplicaCount: 10                   # upper bound on replicas
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "kafka:9092"
        consumerGroup: "pipeline-consumer-group"
        topic: "events-topic"
        lagThreshold: "10"              # scale up when lag exceeds 10
        offsetResetPolicy: "earliest"
